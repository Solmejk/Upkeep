# Builds the Windows app and publishes it as a GitHub Release.
#
#   Release:  git tag v1.0.0 && git push origin v1.0.0
#             -> tests, build, self-test, then a Release "v1.0.0" with
#                Upkeep-Setup-1.0.0.exe (installer) and
#                Upkeep-1.0.0-portable.exe (no install) attached
#   Try out:  Actions tab -> "Build Windows app" -> Run workflow
#             -> the same build, downloadable as an artifact (no Release)

name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          choco install innosetup -y --no-progress

      - name: Work out the version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "dev-$("${{ github.sha }}".Substring(0, 7))" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test and build (python build.py)
        run: python build.py --version ${{ env.VERSION }}

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $run = Start-Process -FilePath "dist\Upkeep.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:APPDATA\Upkeep\self_test.txt"
          if ($run.ExitCode -ne 0) { exit 1 }

      - name: Name the portable .exe after the version
        shell: pwsh
        run: Copy-Item "dist\Upkeep.exe" "dist\Upkeep-${{ env.VERSION }}-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Upkeep-${{ env.VERSION }}
          path: |
            dist/Upkeep-Setup-${{ env.VERSION }}.exe
            dist/Upkeep-${{ env.VERSION }}-portable.exe

      - name: Publish the Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Upkeep-Setup-${{ env.VERSION }}.exe
            dist/Upkeep-${{ env.VERSION }}-portable.exe
          generate_release_notes: true
